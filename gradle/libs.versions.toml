[versions]
# Android y Kotlin
agp = "9.2.1"
# Ksp
ksp = "2.3.10"
coreKtx = "1.19.1"
# Testing
junit = "4.13.2"
junitTest = "1.3.0"
rulesTest = "1.7.0" # Incluye androidx.test:runner
espresso = "3.7.0"
coroutines-test = "1.11.0"
# Lifecycle & XML
appcompat = "1.8.0"
material = "1.14.0"
activity = "1.13.0"
fragmentKtx = "1.9.1"
# Navigation
navVersion = "2.10.2"
# Dependency Injection (Hilt)
hilt = "2.60.1"
# Google Maps
androidGms = "19.2.0"
# Picasso
picassoVersion = "2.71828"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragmentKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navVersion" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navVersion" }

android-play-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "androidGms" }

squareup-picasso = { module = "com.squareup.picasso:picasso", version.ref = "picassoVersion" }

dagger-hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
dagger-hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "junitTest" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "rulesTest" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-espresso-contrib = { module = "androidx.test.espresso:espresso-contrib", version.ref = "espresso" }
dagger-hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
androidx-navigation-testing = { module = "androidx.navigation:navigation-testing", version.ref = "navVersion" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines-test" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
